name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      # Third-party pins ride the same rule as fleet pins (B c30/c31): a
      # semver-major tag floats. @v4 resolved 11d5960a at pin time (== v4.4.0,
      # backport branch, force-movable); upgrades are a deliberate re-pin,
      # never a silent ref move. Read-back: gh api repos/actions/checkout/commits/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Content pins (A c35 class, ported by B to the `uses:` layer):
      # every cross-repo tool this job executes is sha256-pinned by CONTENT,
      # not by tag. Leg 1 pins action.yml BEFORE the composite runs (a
      # force-moved @v1.2.3 tag fails here instead of executing); leg 2 pins
      # the secretgate.py the composite actually fetched into RUNNER_TEMP.
      # Repoint deliberately + re-pin in the SAME commit when upgrading.
      - name: Pin the toolchain (action.yml @ ref, content-locked)
        env:
          PIN_ACTION_REF: b691398821f9137410cdedf7382123d8d175fcc0 # = tag v1.2.3 (leg 1 pins the bytes of the EXECUTING ref, c30 rule)
          PIN_ACTION_SHA: 46d0fdef32e4d766cc121d8d91616129476e58fada17383fc0b3c55f0422dc37
          PIN_ENGINE_SHA: 8d7b91d35888c274576b4c5892ecd30b4090e15c0a9e048d35a0e31e46edbb8a
        run: python3 scripts/pin-verify.py
      # This repo is public curated data: issue-URL tables trip the entropy
      # heuristic by design, so .secretgateignore scopes index.html (generated
      # by tools/bounty-scan/render_site.py) out; guide.html + all other files
      # stay strictly scanned. Dogfoods A's input-hardened secretgate-action
      # @v1.2.3 all-defaults path (engine default v1.2.1 = silent-suppression
      # fixes: word-bounded 'nosec' + strict placeholder rule), third repo
      # after A's own + C's ethkey-lite.
      - uses: tianzhicdev/secretgate-action@b691398821f9137410cdedf7382123d8d175fcc0 # v1.2.3
      - name: Pin the engine the scan actually ran
        env:
          PIN_ACTION_REF: b691398821f9137410cdedf7382123d8d175fcc0 # = tag v1.2.3 (leg 1 pins the bytes of the EXECUTING ref, c30 rule)
          PIN_ACTION_SHA: 46d0fdef32e4d766cc121d8d91616129476e58fada17383fc0b3c55f0422dc37
          PIN_ENGINE_SHA: 8d7b91d35888c274576b4c5892ecd30b4090e15c0a9e048d35a0e31e46edbb8a
          ENGINE_PATH: ${{ runner.temp }}/secretgate.py
        run: python3 scripts/pin-verify.py
