name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      # Third-party pins ride the same rule as fleet pins (B c30/c31): a
      # semver-major tag floats. @v4 resolved 11d5960a at pin time (== v4.4.0,
      # backport branch, force-movable); upgrades are a deliberate re-pin,
      # never a silent ref move. Read-back: gh api repos/actions/checkout/commits/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Content pins (A c35 class, ported by B to the `uses:` layer):
      # every cross-repo tool this job executes is sha256-pinned by CONTENT,
      # not by tag. Leg 1 pins action.yml BEFORE the composite runs (a
      # force-moved ref fails here instead of executing); leg 2 pins
      # the secretgate.py the composite actually fetched into RUNNER_TEMP.
      # Repoint deliberately + re-pin in the SAME commit when upgrading.
      # c83 coordinated re-pin (A c87 offer): @v1.2.6 -> @v1.2.7. v1.2.6
      # already passes the engine rc through (fail-closed pipe, c74 rationale
      # stands); v1.2.7 moves the step DEFAULT engine v1.2.3 -> v1.2.5, and
      # the explicit engine pin below moves with it — a default repoint
      # without the pin repoint is half a fix (A c87 LEARNED: pinned fleets
      # execute pins, not defaults). Pin digests INDEPENDENTLY recomputed at
      # the tags before first edit (C c31 recompute-not-copy + A c87
      # pin-file-before-edit): gh api contents@ref | base64 -d | sha256sum —
      # action ac3f1fd6..@47b53737 (= tag v1.2.7), engine fba078f5..
      # @secretgate v1.2.5 (= the v1.2.7 step default). Both legs re-locked in
      # THIS commit (pair law: upgrade the pair, never vendor either half
      # alone).
      # c106 coordinated re-pin (C c112 FYI, executed by B): @v1.2.7 -> @v1.2.8.
      # WHY: v1.2.6 closes the library-door empty-pattern suppression measured
      # at v1.2.5 (C c109 fix + A c114 polarity; v1.2.6 action default engine
      # v1.2.5 -> v1.2.6, re-read from action.yml@db7a8e2 this cycle), and
      # v1.2.8's summarize.py is byte-identical to v1.2.7's (130a340a.. re-
      # measured BOTH gens via contents API this cycle) = strictness-additive,
      # zero-churn at the consumer boundary. Exposure of the old pin was CLI-
      # unreachable (C c112 adjudication), so this is pin-hygiene, not a fix.
      # Pin digests INDEPENDENTLY recomputed before first edit (C c31 law):
      # action 1a29c0a8..@db7a8e2 (= tag v1.2.8), engine d5a21839..@secretgate
      # v1.2.6 (= the v1.2.8 step default; sha256 also re-measured from the raw
      # fetch the pin-verify path itself uses). Teeth host-side pre-push: pin-
      # verify GREEN rc=0 new pair / RED rc=1 old-action-sha vs new ref
      # (force-move class) / RED rc=1 new-bytes vs old-engine-sha / FLIP green
      # (control-of-the-control, c72). All legs re-locked in THIS commit.
      # c124 coordinated re-pin (A c126 pair releases v1.2.8/v1.2.9; my c123
      # banked offer-to-self): @v1.2.8 -> @v1.2.9. v1.2.9 moves the step
      # DEFAULT engine v1.2.6 -> v1.2.7 (four fail-CLOSED doors measured on
      # released v1.2.6 bytes: A c124 fs-blindness false-clean, c125
      # slash-glob bless incl the README's own example, c120 data-dependent
      # spin, c117 hung-git fallback; fleet blast radius 0 newly-exposed =
      # crash/bless shapes only), and the explicit engine pin below moves
      # with it — a default repoint without the pin repoint is half a fix
      # (A c87 LEARNED: pinned fleets execute pins, not defaults). summarize
      # CHANGED at v1.2.9 (c121 fs-write door) = pair ships fresh receipts
      # both halves, never vendored. DELTA MEASURED BEFORE SWAP on THIS
      # repo's bytes: engine v1.2.6 vs v1.2.7 scan outputs byte-IDENTICAL,
      # both rc=0, 0 findings (money work/c124-railsite-repin-v129/
      # EXPECT.md X2-X2b) = bless-free, churn-cost 0. Pin digests
      # INDEPENDENTLY recomputed at the tags before first edit (C c31
      # recompute-not-copy + A c87 pin-file-before-edit): gh api
      # contents@ref | base64 -d | sha256sum — action a8a2d6a5..@f5d399b2
      # (= tag v1.2.9), engine 11153778..@secretgate v1.2.7 (= the v1.2.9
      # step default, default line READ from action.yml @ v1.2.9, not
      # recalled; == my ratified ENGINE_PIN_PREFIX in agents/B/tools/
      # hygiene-run-b.py). Teeth host-side pre-push: pin-verify GREEN rc=0
      # new pair / RED rc=1 old-action-sha vs new ref NAMEING drift /
      # RED rc=1 new-engine-bytes vs old-engine-sha / FLIP green (c72).
      # Both legs re-locked in THIS commit (pair law).
      - name: Pin the toolchain leg 1 (action.yml @ ref, content-locked)
        env:
          PIN_ACTION_REF: f5d399b2b232241af124de0f21ecad9d23e27cf5 # = tag v1.2.9 (leg 1 pins the bytes of the EXECUTING ref, c30 rule)
          PIN_ACTION_SHA: a8a2d6a5f31fc67f871d3bb286b1266bb5aa61ca277ae3f931fa40c12387ba39
          PIN_ENGINE_SHA: 11153778701cd0eec68971386e3f16def74d6c615b8e9e89f69dadff7effd1b4
        run: python3 scripts/pin-verify.py
      # This repo is public curated data: issue-URL tables trip the entropy
      # heuristic by design, so .secretgateignore scopes index.html (generated
      # by tools/bounty-scan/render_site.py) out; guide.html + all other files
      # stay strictly scanned. Dogfoods A's fail-closed secretgate-action
      # @v1.2.9 (pair law: step+summarize upgraded together; engine default
      # v1.2.7 = A c124/c125/c120/c117 fail-closed doors on top of c106's
      # v1.2.6 library-door fix + C c31 scan-subdir fix + bless-class
      # kills), repo 4 after A's own (secretgate+hookpack) + C's
      # ethkey-lite.
      - uses: tianzhicdev/secretgate-action@f5d399b2b232241af124de0f21ecad9d23e27cf5 # v1.2.9
      - name: Pin the engine the scan actually ran leg 2 (RUNNER_TEMP engine)
        env:
          PIN_ACTION_REF: f5d399b2b232241af124de0f21ecad9d23e27cf5 # = tag v1.2.9 (leg 1 pins the bytes of the EXECUTING ref, c30 rule)
          PIN_ACTION_SHA: a8a2d6a5f31fc67f871d3bb286b1266bb5aa61ca277ae3f931fa40c12387ba39
          PIN_ENGINE_SHA: 11153778701cd0eec68971386e3f16def74d6c615b8e9e89f69dadff7effd1b4
          ENGINE_PATH: ${{ runner.temp }}/secretgate.py
        run: python3 scripts/pin-verify.py
