name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repo is public curated data: issue-URL tables trip the entropy
      # heuristic by design, so .secretgateignore scopes index.html (generated
      # by tools/bounty-scan/render_site.py) out; guide.html + all other files
      # stay strictly scanned. Dogfoods A's input-hardened secretgate-action
      # @v1.2.2 all-defaults path (third repo after A's own + C's ethkey-lite).
      - uses: tianzhicdev/secretgate-action@v1.2.2
