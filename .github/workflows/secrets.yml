name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      # Third-party pins ride the same rule as fleet pins (B c30/c31): a
      # semver-major tag floats. @v4 resolved 11d5960a at pin time (== v4.4.0,
      # backport branch, force-movable); upgrades are a deliberate re-pin,
      # never a silent ref move. Read-back: gh api repos/actions/checkout/commits/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Content pins (A c35 class, ported by B to the `uses:` layer):
      # every cross-repo tool this job executes is sha256-pinned by CONTENT,
      # not by tag. Leg 1 pins action.yml BEFORE the composite runs (a
      # force-moved ref fails here instead of executing); leg 2 pins
      # the secretgate.py the composite actually fetched into RUNNER_TEMP.
      # Repoint deliberately + re-pin in the SAME commit when upgrading.
      # c74 coordinated re-pin (C c77 offer): @v1.2.4 -> @v1.2.6. The v1.2.4
      # pair (step + v1.2.5-identical summarize) MEASURED blessing all damage
      # legs in C's c77 2x2 generation matrix on his own harness; v1.2.6
      # passes the engine rc through (rc>=2 exits with the engine's code,
      # summarize failure exits) = fail-closed pipe. Pin digests INDEPENDENTLY
      # recomputed this cycle (C c31 rule: recompute, don't copy):
      # gh api contents@ref | base64 -d | sha256sum — action 135754e7..
      # @1e4195b8, engine c8b8c1e3.. @secretgate v1.2.3 (the step's default
      # fetch tag, unchanged). Both legs re-locked in THIS commit (pair law:
      # upgrade the pair, never vendor either half alone).
      - name: Pin the toolchain leg 1 (action.yml @ ref, content-locked)
        env:
          PIN_ACTION_REF: 1e4195b86761462507f44d38046feb814416d269 # = tag v1.2.6 (leg 1 pins the bytes of the EXECUTING ref, c30 rule)
          PIN_ACTION_SHA: 135754e7df1a75e374a9f2f319196a83781dfe81bae1d16c12469132f43d41a4
          PIN_ENGINE_SHA: c8b8c1e3dd52a9dde0b7722652bc8b1d9f9fc5760a354c695f460d3d80501607
        run: python3 scripts/pin-verify.py
      # This repo is public curated data: issue-URL tables trip the entropy
      # heuristic by design, so .secretgateignore scopes index.html (generated
      # by tools/bounty-scan/render_site.py) out; guide.html + all other files
      # stay strictly scanned. Dogfoods A's fail-closed secretgate-action
      # @v1.2.6 (pair law: step+summarize upgraded together; engine default
      # v1.2.3 = C c31 scan-subdir false-clean fix), repo 4 after A's own
      # (secretgate+hookpack) + C's ethkey-lite.
      - uses: tianzhicdev/secretgate-action@1e4195b86761462507f44d38046feb814416d269 # v1.2.6
      - name: Pin the engine the scan actually ran leg 2 (RUNNER_TEMP engine)
        env:
          PIN_ACTION_REF: 1e4195b86761462507f44d38046feb814416d269 # = tag v1.2.6 (leg 1 pins the bytes of the EXECUTING ref, c30 rule)
          PIN_ACTION_SHA: 135754e7df1a75e374a9f2f319196a83781dfe81bae1d16c12469132f43d41a4
          PIN_ENGINE_SHA: c8b8c1e3dd52a9dde0b7722652bc8b1d9f9fc5760a354c695f460d3d80501607
          ENGINE_PATH: ${{ runner.temp }}/secretgate.py
        run: python3 scripts/pin-verify.py
