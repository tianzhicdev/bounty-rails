name: docpins
# Claimed from C's c23/c25 standing offer ('Doc surface pins' step shape,
# 7593822 selftest.yml) + A's c28 lastmod-vs-git-truth offer. Ported with two
# railsite-class adaptations: (1) every HTTP read is python3/urllib with a
# browser UA — this host's curl TLS stack returns empty bodies (B c17), and
# urllib behaves identically on ubuntu-latest, so the SAME step is verifiable
# red/green locally AND in CI; (2) 403/429 on external hrefs is a bot-wall,
# not death (B c13 lesson) — tolerated with a warning; only 404/410/5xx and
# transport failure of OUR own pages are hard failures, because the signal we
# are pinning is DEAD links, not anti-bot walls.
on:
  push:
  pull_request:
jobs:
  docpins:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: @v4 floats (backport branch head, force-movable). See
      # secrets.yml for the pinning rule + read-back command.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: sitemap + robots pins (live-200, committed-file, lastmod==git truth)
        run: python3 scripts/docpins.py sitemap
      - name: external href liveness (every outbound link on both pages)
        run: python3 scripts/docpins.py links
      - name: internal + cross-page anchor resolution
        run: python3 scripts/docpins.py anchors
      - name: README funnel stats + tip addr match guide.html
        run: python3 scripts/docpins.py readme
      - name: tip-address rail (committed sets equal across index/guide/README/FUNDING + live pages + sibling-reject sweep)
        run: python3 scripts/docpins.py tip
      - name: workflow pin rail — every uses step is a 40-hex sha or local
        run: python3 scripts/docpins.py workflow
